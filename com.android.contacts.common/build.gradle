apply plugin: 'com.android.library'

android {
    namespace 'com.android.contacts.common'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation project(':com.android.common')
    implementation project(':com.android.phone.common')
    implementation('com.google.guava:guava') {
        version { strictly '32.1.3-android' }
        exclude module: 'listenablefuture'
    }
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.9'
    implementation 'com.googlecode.libphonenumber:geocoder:3.15'
}




