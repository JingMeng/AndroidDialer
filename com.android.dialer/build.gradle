apply plugin: 'com.android.application'

android {
    namespace 'com.android.dialer'
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'com/google/i18n/phonenumbers/data/PhoneNumberMetadataProto*']
        }
    }
    compileSdk 34

    defaultConfig {
        applicationId "com.android.dialer"
        minSdk 21
        targetSdk 34
        versionCode 71
        versionName "7.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation project(':com.android.common')
    implementation project(':com.android.phone.common')
    implementation project(':com.android.contacts.common')
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.9'
    implementation 'com.googlecode.libphonenumber:geocoder:3.15'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation('com.google.guava:guava') {
        version { strictly '32.1.3-android' }
        // listenablefuture is duplicated in guava itself
        exclude module: 'listenablefuture'
    }
}

configurations.all {
    exclude module: 'listenablefuture'
}





